name: test-bindings

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CMAKE_GENERATOR: Ninja

permissions:
  contents: read

jobs:
  python_bindings:
    name: Test Python ${{ matrix.python-version }} bindings on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python bindings on ${{ matrix.os }}
        run: python -m pip install .
      - name: Run example on ${{ matrix.os }} under Python ${{ matrix.python-version }}
        run: python bindings/python/google_benchmark/example.py

  rust_bindings:
    name: Test Rust bindings on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Run Rust tests natively via Cargo
        run: cargo test
        working-directory: bindings/rust
      - name: Run Rust tests via CMake
        run: |
          cmake -S . -B build -DBENCHMARK_ENABLE_RUST_BINDINGS=ON -DBENCHMARK_DOWNLOAD_DEPENDENCIES=ON
          cmake --build build
          cd build && ctest -R rust_bindings_tests

  zig_bindings:
    name: Test Zig bindings on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0
      # Linux: `zig build test` covers this directly (cmake build + native
      # Zig tests + the C++ adapter smoke test) and is verified reliable.
      - name: Run zig build test (Linux)
        if: runner.os == 'Linux'
        run: zig build test
        working-directory: bindings/zig
      # Linux, Clang + libc++: exercises the -Dclang=true toolchain added
      # to build.zig (see docs/architecture.md#build-system-flow). Only on
      # Linux — untested on macOS, see the macOS block below.
      # Note: don't add libunwind-dev explicitly — libc++-dev already pulls
      # in the matching LLVM libunwind as a transitive dependency, and it
      # conflicts with GNU's libunwind-dev package if both are requested.
      - name: Install Clang + libc++ (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libc++-dev libc++abi-dev
      - name: Run zig build test -Dclang=true (Linux)
        if: runner.os == 'Linux'
        run: zig build test -Dclang=true
        working-directory: bindings/zig
      # macOS: kept as separate manual steps rather than `zig build test`.
      # build.zig's test/run steps link static libstdc++/libgcc archives
      # located via `g++ -print-file-name=...`, which is GNU-specific —
      # Apple's toolchain (Clang/libc++, no libstdc++.a) is not verified to
      # provide them, so this leg is left untouched to avoid breaking CI on
      # an assumption. See docs/architecture.md#build-system-flow.
      - name: Build libbenchmark + adapter via CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S bindings/zig -B bindings/zig/cmake-build \
            -DBENCHMARK_ENABLE_TESTING=OFF \
            -DBENCHMARK_ENABLE_LTO=OFF \
            -DBENCHMARK_ENABLE_WERROR=OFF \
            -DCMAKE_BUILD_TYPE=Release
        working-directory: .
      - name: Build combined archive (macOS)
        if: runner.os == 'macOS'
        run: cmake --build bindings/zig/cmake-build --config Release --parallel
        working-directory: .
      - name: Run adapter C++ tests (macOS)
        if: runner.os == 'macOS'
        run: |
          cd bindings/zig
          g++ -std=c++17 -I src -I ../../include \
            test_adapter.cc \
            -L cmake-build -lbenchmark_combined \
            -lstdc++ -lpthread -lm \
            -o test_adapter
          ./test_adapter
      - name: Verify Zig module compiles (macOS)
        if: runner.os == 'macOS'
        run: |
          cd bindings/zig
          zig build-lib src/benchmark.zig -I src -I ../../include -OReleaseFast
